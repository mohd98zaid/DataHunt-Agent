name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-github-actions-annotate-failures

      - name: Run Pytest Suite
        id: run_pytest
        run: |
          python -m pytest tests/ -v --tb=short 2>&1 | tee pytest_output.log
        continue-on-error: true

      - name: Publish Test Summary
        if: always()
        run: |
          echo "### Pytest Summary (${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 pytest_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.run_pytest.outcome }}" != "success" ]; then
            FAILURES=$(grep -E 'FAILED |ERROR ' pytest_output.log | tr '\n' ' ' || true)
            echo "::error title=Pytest Failures [Python ${{ matrix.python-version }}]::${FAILURES}"
            exit 1
          fi
